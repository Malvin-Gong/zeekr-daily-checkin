name: 极氪每日日常任务

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10，每天一次
    # 脚本自带 10~180 秒随机延迟，单次即可，避免同一天重复打卡留下固定痕迹
    # 若某天 GitHub cron 延迟/丢跑，到 Actions 页手动 Run workflow 一次即可补
    - cron: '10 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击运行测试

permissions:
  contents: read

concurrency:
  group: zeekr-checkin
  cancel-in-progress: false

jobs:
  zeekr-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7

      - name: 配置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 语法自检
        run: python -m py_compile src/checkin.py

      - name: 执行极氪签到与任务
        env:
          ZEEKR_TOKEN: ${{ secrets.ZEEKR_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          set -o pipefail
          python src/checkin.py --gha 2>&1 | tee checkin.log

      - name: 结果校验与摘要
        if: always()
        run: |
          {
            echo "## 极氪日常任务结果"
            echo ""
            echo '```'
            grep -vE "^\s*$" checkin.log 2>/dev/null || echo "(空日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -qE "AUTH_ERROR|\[ERROR\]|[❌]" checkin.log 2>/dev/null; then
            echo "::error::日志中存在失败项，详见本次运行的 Step Summary"
            exit 1
          fi
          echo "✅ 日志中未发现失败项"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkin-log-${{ github.run_number }}
          path: checkin.log
          retention-days: 14
          if-no-files-found: warn
